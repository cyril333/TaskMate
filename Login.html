<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task-Mate — Log in</title>
<script src="auth.js" data-page="login"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

  <nav class="navbar">
    <a class="logo" href="index.html">Task<span>Mate</span><div class="form-tag">FORM TM-002</div></a>
    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="login.html" class="nav-btn active">Login</a>
        <a href="register.html" class="nav-btn">Register</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-head">
        <div>
          <div class="doc-number">SEC. L — ACCESS REQUEST</div>
          <h1>Log in</h1>
        </div>
        <span class="auth-stamp">Authorized only</span>
      </div>
      <p class="subtitle">Present your credentials to open your ledger.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com" aria-describedby="emailErr">
          <p class="field-error" id="emailErr" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input type="password" id="password" autocomplete="current-password" placeholder="Your password" aria-describedby="passwordErr">
            <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
          </div>
          <p class="field-error" id="passwordErr" aria-live="polite"></p>
        </div>

        <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in</label>

        <p class="form-error" id="formErr" role="alert"></p>
        <button type="submit" class="btn btn-block" id="submitBtn">Submit credentials</button>
      </form>

      <p class="auth-alt">No record on file? <a href="register.html">Register here</a></p>
    </section>
  </main>

</body>
</html>
